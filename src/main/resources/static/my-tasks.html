<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/tour.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">TM</div>
            <div>
                <h2>Task Manager</h2>
                <p>Internal Tools</p>
            </div>
        </div>

        <nav class="side-nav">
            <a href="/dashboard.html">Dashboard</a>
            <a class="active" href="/my-tasks.html">My Tasks</a>
            <a href="/team-tasks.html">Team Tasks</a>
            <a href="/create-task.html">Create Task</a>
            <a href="/reports.html">Reports</a>
            <a href="/log-time.html">Log Time</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>
                <p class="eyebrow">Assigned to me</p>
                <h1>My Tasks</h1>
                <p id="userName" class="muted">Loading user...</p>
            </div>

            <div class="header-actions">
                <button id="themeToggle" class="secondary-button" type="button" aria-label="Toggle color theme"></button>
                <a href="/create-task.html" class="primary-button">+ New Task</a>
            </div>
        </header>

        <section class="panel">
            <div class="panel-header">
                <div>
                    <h2>Task List</h2>
                    <p id="myTasksSubtitle">Tasks assigned to your account</p>
                </div>
            </div>

            <div class="table-filters">
                <input id="titleFilter" type="search" aria-label="Filter by title" placeholder="Title">

                <select id="statusFilter" aria-label="Filter by status">
                    <option value="">All statuses</option>
                    <option value="TO_DO">To Do</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="ON_HOLD">On Hold</option>
                    <option value="COMPLETED">Completed</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>

                <select id="priorityFilter" aria-label="Filter by priority">
                    <option value="">All priorities</option>
                    <option value="LOW">Low</option>
                    <option value="MEDIUM">Medium</option>
                    <option value="HIGH">High</option>
                </select>

                <input id="dueDateFilter" type="search" aria-label="Filter by due date" placeholder="Due date">
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th><button type="button" class="sort-header" data-sort="title">Title</button></th>
                        <th><button type="button" class="sort-header" data-sort="status">Status</button></th>
                        <th><button type="button" class="sort-header" data-sort="priority">Priority</button></th>
                        <th><button type="button" class="sort-header" data-sort="dueDate">Due Date</button></th>
                        <th>Details</th>
                        <th>Update Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="myTasksTable"></tbody>
            </table>
        </section>
    </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/myTasks.js"></script>
<script src=/js/tour.js></script>
</body>
</html>
